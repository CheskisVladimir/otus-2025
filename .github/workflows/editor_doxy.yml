name: Deploy Doxygen Docs

on:
  push:
    branches: [ Editor ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Generate Doxygen documentation
        run: |
          cd Editor
          doxygen Doxyfile

      - name: Create .nojekyll for GitHub Pages
        run: |
          # Create in the exact directory that will be published
          mkdir -p ./Editor/docs/html
          echo "" > ./Editor/docs/html/.nojekyll  # Empty file is sufficient
          
          # Verify it exists
          ls -la ./Editor/docs/html/
          cat ./Editor/docs/html/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./Editor/docs/html
          destination_dir: ${{ github.ref_name }}
          keep_files: true
          create_branch: true
          branch: gh-pages
          enable_jekyll: false