name: Deploy Doxygen Docs

on:
  push:
    branches: [ Editor ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Generate Doxygen documentation
        run: |
          cd Editor
          doxygen Doxyfile

      - name: Deploy to GitHub Pages (auto-create branch)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./Editor/docs/html
          destination_dir: ${{ github.ref_name }}
          keep_files: true
          # CRITICAL: This creates gh-pages if missing!
          create_branch: true 
          branch: gh-pages  # Explicitly name the branch